steps:
  - label: ":maven: Build and Deploy"
    command:
      - export JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64
      - export PATH="$JAVA_HOME/bin:$PATH"
      - export SONAR_TOKEN=$(buildkite-agent secret get SONAR_TOKEN)
      - mvn clean deploy
      - mvn sonar:sonar -Dsonar.token=$${SONAR_TOKEN} -Dsonar.branch.name=development
    plugins:
      - test-collector#v1.0.0:
          files: "target/surefire-reports/*.xml"
          format: "junit"
    secrets:
      BUILDKITE_ANALYTICS_TOKEN: "NaturalOrderedLongBuildKiteToken"
    agents:
      queue: "java_build_queue_aws"
